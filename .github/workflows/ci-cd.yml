name: ci-cd

# CI: every pull request and every push to develop or release/**.
# CD: push to develop -> dev. Push to release/** -> itg. Branch flow: docs/BRANCHING_AND_RELEASE.md.

on:
  pull_request:
    branches: [develop, "release/**"]
  push:
    branches: [develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: pokedex-agent

jobs:
  ci:
    name: CI (lint and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  deploy-dev:
    name: CD (dev)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "${IMAGE_NAME}:${{ github.sha }}" \
            .
      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}" \
            --set-env-vars "LOG_LEVEL=INFO" "POKEDEX_MAX_TOOL_CALLS=${{ vars.POKEDEX_MAX_TOOL_CALLS }}"

  deploy-itg:
    name: CD (itg)
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: itg
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "${IMAGE_NAME}:${{ github.sha }}" \
            .
      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}" \
            --set-env-vars "LOG_LEVEL=INFO" "POKEDEX_MAX_TOOL_CALLS=${{ vars.POKEDEX_MAX_TOOL_CALLS }}"
